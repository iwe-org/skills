schema_version = "1.4"
multi_step_reward_strategy = "mean"

[task]
name = "iwe/drain-triage"
version = "0.1.0"
description = "A backlog of mostly-empty sessions drained two-speed: one cheap triage pass over the whole frontier, full curation only on the session that keeps something, and nothing capturable dropped."

[metadata]
category = "memory"
tags = ["iwe", "memory", "backfill", "cost", "precision"]

[environment]
docker_image = "iwe-memory-evals:latest"
workdir = "/app"
network_mode = "public"
build_timeout_sec = 900.0

[agent]
timeout_sec = 1200.0

[verifier]
timeout_sec = 300.0
environment_mode = "shared"

[[steps]]
name = "backlog"

[steps.agent]
timeout_sec = 1200.0

[steps.verifier]
timeout_sec = 300.0

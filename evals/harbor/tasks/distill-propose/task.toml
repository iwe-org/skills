schema_version = "1.4"

[task]
name = "iwe/distill-propose"
version = "0.1.0"
description = "Proposal recall and precision: a distill run over a dense session lists every proposal it would put up, against a labelled gold set, and writes nothing to memory because nobody is there to select."

[metadata]
category = "memory"
tags = ["iwe", "memory", "distill", "quality", "gold"]

[environment]
docker_image = "iwe-memory-evals:latest"
workdir = "/app"
network_mode = "public"
build_timeout_sec = 900.0

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 300.0
environment_mode = "shared"

[[steps]]
name = "propose"

[steps.agent]
timeout_sec = 900.0

[steps.verifier]
timeout_sec = 300.0

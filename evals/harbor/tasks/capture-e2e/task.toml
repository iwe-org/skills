schema_version = "1.4"
multi_step_reward_strategy = "mean"

[task]
name = "iwe/capture-e2e"
version = "0.1.0"
description = "The whole loop: a real session hits a planted gotcha, the Stop sweep captures it into the memory workspace, and a later session deploys without re-diagnosing."

[metadata]
category = "memory"
tags = ["iwe", "memory", "capture", "recall"]

[environment]
docker_image = "iwe-memory-evals:latest"
workdir = "/app"
network_mode = "public"
build_timeout_sec = 900.0

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 300.0
environment_mode = "shared"

[[steps]]
name = "work"

[steps.agent]
timeout_sec = 900.0

[steps.verifier]
timeout_sec = 300.0

[[steps]]
name = "flush"

[steps.agent]
timeout_sec = 900.0

[steps.verifier]
timeout_sec = 300.0

[[steps]]
name = "recall"

[steps.agent]
timeout_sec = 900.0

[steps.verifier]
timeout_sec = 300.0

schema_version = "1.4"
multi_step_reward_strategy = "mean"

[task]
name = "iwe/stale-claim"
version = "0.1.0"
description = "A capture that died leaves its chunk pending; the next sweep expires the claim, re-imports the same span onto the same key, and hands it to a fresh agent rather than losing it."

[metadata]
category = "memory"
tags = ["iwe", "memory", "capture", "recovery"]

[environment]
docker_image = "iwe-memory-evals:latest"
workdir = "/app"
network_mode = "public"
build_timeout_sec = 900.0

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 300.0
environment_mode = "shared"

[[steps]]
name = "expire"

[steps.agent]
timeout_sec = 900.0

[steps.verifier]
timeout_sec = 300.0

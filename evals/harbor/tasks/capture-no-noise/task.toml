schema_version = "1.4"
multi_step_reward_strategy = "mean"

[task]
name = "iwe/capture-no-noise"
version = "0.1.0"
description = "A session with nothing durable in it must leave the memory store empty: the policy's 'prefer none over noise' bar, with a real model doing the extracting."

[metadata]
category = "memory"
tags = ["iwe", "memory", "capture", "precision"]

[environment]
docker_image = "iwe-memory-evals:latest"
workdir = "/app"
network_mode = "public"
build_timeout_sec = 900.0

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 300.0
environment_mode = "shared"

[[steps]]
name = "busywork"

[steps.agent]
timeout_sec = 900.0

[steps.verifier]
timeout_sec = 300.0

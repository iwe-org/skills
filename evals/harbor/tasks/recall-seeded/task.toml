schema_version = "1.4"
multi_step_reward_strategy = "mean"

[task]
name = "iwe/recall-seeded"
version = "0.1.0"
description = "With a seeded memory workspace, a session must reach a decision that is written nowhere in the repository. Paired with iwe/recall-baseline; the number that matters is the delta."

[metadata]
category = "memory"
tags = ["iwe", "memory", "recall"]
pair = "iwe/recall-baseline"

[environment]
docker_image = "iwe-memory-evals:latest"
workdir = "/app"
network_mode = "public"
build_timeout_sec = 900.0

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 300.0
environment_mode = "shared"

[[steps]]
name = "deploy"

[steps.agent]
timeout_sec = 900.0

[steps.verifier]
timeout_sec = 300.0

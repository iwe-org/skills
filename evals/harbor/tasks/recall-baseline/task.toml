schema_version = "1.4"
multi_step_reward_strategy = "mean"

[task]
name = "iwe/recall-baseline"
version = "0.1.0"
description = "The control for iwe/recall-seeded: the same instruction in the same repository with no memory workspace at all. Its answer_target and answer_reason metrics are the baseline the seeded run is measured against."

[metadata]
category = "memory"
tags = ["iwe", "memory", "recall", "control"]
pair = "iwe/recall-seeded"

[environment]
docker_image = "iwe-memory-evals:latest"
workdir = "/app"
network_mode = "public"
build_timeout_sec = 900.0

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 300.0
environment_mode = "shared"

[[steps]]
name = "deploy"

[steps.agent]
timeout_sec = 900.0

[steps.verifier]
timeout_sec = 300.0

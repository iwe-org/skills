schema_version = "1.4"
multi_step_reward_strategy = "mean"

[task]
name = "iwe/agnostic-store"
version = "0.1.0"
description = "A store with its own ontology (zettel documents, own schema and template, own key prefix) and a policy describing it: a distill run writes that shape, and nothing from any default ontology appears."

[metadata]
category = "memory"
tags = ["iwe", "memory", "capture", "agnostic"]

[environment]
docker_image = "iwe-memory-evals:latest"
workdir = "/app"
network_mode = "public"
build_timeout_sec = 900.0

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 300.0
environment_mode = "shared"

[[steps]]
name = "zettel"

[steps.agent]
timeout_sec = 900.0

[steps.verifier]
timeout_sec = 300.0

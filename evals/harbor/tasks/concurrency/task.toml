schema_version = "1.4"
multi_step_reward_strategy = "mean"

[task]
name = "iwe/concurrency"
version = "0.1.0"
description = "Two pending transcripts and two sweeps racing over them import each span exactly once — the chunk keys are the same either way — and leave no duplicate work behind."

[metadata]
category = "memory"
tags = ["iwe", "memory", "capture", "concurrency"]

[environment]
docker_image = "iwe-memory-evals:latest"
workdir = "/app"
network_mode = "public"
build_timeout_sec = 900.0

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 300.0
environment_mode = "shared"

[[steps]]
name = "race"

[steps.agent]
timeout_sec = 900.0

[steps.verifier]
timeout_sec = 300.0
